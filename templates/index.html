<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII ART WEB</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .container {
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px; /* Rounded corners */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button[type="reset"] {
            background-color: #6c757d;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Result container to stretch across full width */
        #asciiArtContainer {
            width: 100%; /* Full width of the browser */
            margin-top: 30px; /* Spacing from the form */
            text-align: left;
        }

        #asciiArtResult {
            width: 100%; /* Full width */
            min-height: 400px;
            font-family: monospace;
            resize: vertical;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            /* Add drop shadow */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
            overflow: auto; /* Allow scrolling if the content is too long */
            border: 1px solid #ccc; /* Border for the ASCII art result text box */
            white-space: pre; /* Preserve whitespace and allow newlines */
        }

        .error-message {
            color: red;
            margin-bottom: 15px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #fdd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ASCII Art Generator</h1>
        
        <!-- Error Message -->
        {{if .Error}}
            <p class="error-message">Error: {{.Error}}</p>
        {{end}}
        
        <!-- Form -->
        <form action="/" method="POST">
            <label for="inputText">Enter text:</label>
            <textarea id="inputText" name="inputText" rows="4" required>{{.InputText}}</textarea>
    
            <label for="bannerSelect">Select banner:</label>
            <select id="bannerSelect" name="banner" required>
                <option value="" disabled {{if not .Banner}}selected{{end}}>Select a banner</option>
                <option value="standard" {{if eq .Banner "standard"}}selected{{end}}>Standard</option>
                <option value="shadow" {{if eq .Banner "shadow"}}selected{{end}}>Shadow</option>
                <option value="thinkertoy" {{if eq .Banner "thinkertoy"}}selected{{end}}>Thinkertoy</option>
            </select>
    
            <button type="submit">Generate ASCII Art</button>
            <button type="reset">Clear</button>
        </form>
    </div>

    <!-- ASCII Art Result Container -->
    <div id="asciiArtContainer">
        {{if .Result}}
            <h2>Result:</h2>
            <textarea id="asciiArtResult" readonly>{{.Result}}</textarea>
        {{end}}
    </div>
</body>
</html>
